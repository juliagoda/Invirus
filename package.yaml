name:                Invirus
version:             0.1.0.0
github:              "juliagoda/Invirus"
license:             MIT
author:              "Jagoda Gorska"
maintainer:          "juliagoda.pl@protonmail.com"
copyright:           "2026 Jagoda \"juliagoda\" Gorska"

extra-source-files:
- README.md
- CHANGELOG.md

category:            Security

description:         Please see the README on GitHub at <https://github.com/juliagoda/Invirus>

dependencies:
- base >= 4.20.2.0
- filepath >= 1.5.4.0
- directory >= 1.3.8.5
- streamly >= 0.10.1
- streamly-core >= 0.2.3
- streamly-process >= 0.3.1
- crypton >= 1.0.6
- memory >= 0.18.0
- bytestring >= 0.12.2.0
- wreq >= 0.5.4.4
- lens >= 5.3.6
- aeson >= 2.2.5.0
- lens-aeson >= 1.2.3
- extra >= 1.8.1

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  Invirus-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Invirus

tests:
  Invirus-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Invirus
